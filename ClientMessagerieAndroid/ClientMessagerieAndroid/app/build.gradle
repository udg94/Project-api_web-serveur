plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.tp.messagerie'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.tp.messagerie'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
